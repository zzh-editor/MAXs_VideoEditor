<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto">
      <path d="M0,0 L18,8 L0,16 Z" fill="#ADF911"/>
    </marker>
    <style>
      text { font-family: "MiSans VF", "PingFang SC", sans-serif; }
      .title { font-size: 62px; font-weight: 700; fill: #F5F5F5; }
      .sub { font-size: 30px; fill: #A9A9A9; }
      .node { font-size: 36px; font-weight: 700; fill: #F5F5F5; }
      .detail { font-size: 25px; fill: #A9A9A9; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#161616"/>
  <text class="title" x="144" y="142">模型制作流程</text>
  <text class="sub" x="144" y="195">把操作顺序讲清，再展开每一步的检查点</text>
  <line x1="144" y1="240" x2="1776" y2="240" stroke="#444444" stroke-width="2"/>

  <rect x="150" y="390" width="300" height="180" rx="8" fill="#222222" stroke="#5E5E5E" stroke-width="3"/>
  <text class="node" x="300" y="470" text-anchor="middle">基础网格</text>
  <text class="detail" x="300" y="520" text-anchor="middle">建立形体</text>
  <path d="M450 480 H550" fill="none" stroke="#ADF911" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="570" y="390" width="300" height="180" rx="8" fill="#ADF911"/>
  <text x="720" y="470" text-anchor="middle" fill="#161616" font-size="36px" font-weight="700" font-family="MiSans VF, PingFang SC, sans-serif">拓扑检查</text>
  <text x="720" y="520" text-anchor="middle" fill="#161616" font-size="25px" font-family="MiSans VF, PingFang SC, sans-serif">变形前验证结构</text>
  <path d="M870 480 H970" fill="none" stroke="#ADF911" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="990" y="390" width="300" height="180" rx="8" fill="#222222" stroke="#5E5E5E" stroke-width="3"/>
  <text class="node" x="1140" y="470" text-anchor="middle">绑定</text>
  <text class="detail" x="1140" y="520" text-anchor="middle">控制形变</text>
  <path d="M1290 480 H1390" fill="none" stroke="#ADF911" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1410" y="390" width="300" height="180" rx="8" fill="#222222" stroke="#5E5E5E" stroke-width="3"/>
  <text class="node" x="1560" y="470" text-anchor="middle">动画测试</text>
  <text class="detail" x="1560" y="520" text-anchor="middle">回看变形结果</text>

  <text x="150" y="680" fill="#ADF911" font-size="30" font-weight="700" font-family="MiSans VF, PingFang SC, sans-serif">检查点</text>
  <text class="detail" x="150" y="735">法线与边流</text>
  <text class="detail" x="570" y="735">关节影响范围</text>
  <text class="detail" x="990" y="735">控制器层级</text>
  <text class="detail" x="1410" y="735">极限姿势和穿插</text>
  <line x1="144" y1="835" x2="1776" y2="835" stroke="#444444" stroke-width="2"/>
  <text class="detail" x="144" y="800">教学流程示意；节点名称和检查内容按课程实际操作替换</text>
  <!-- y=870..1080 remains clear for captions (210 px minimum) -->
</svg>
