<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      text { font-family: "MiSans VF", "PingFang SC", sans-serif; }
      .title { font-size: 54px; font-weight: 700; fill: #1C1C1A; }
      .sub { font-size: 30px; fill: #6A6963; }
      .label { font-size: 30px; font-weight: 700; fill: #1C1C1A; }
      .body { font-size: 28px; font-weight: 600; fill: #1C1C1A; }
      .axis { font-size: 24px; fill: #6A6963; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="#F5F5F5"/>
  <text class="title" x="108" y="188">求职准备时间</text>
  <text class="sub" x="108" y="242">从入学开始，把准备时间留出来</text>
  <text class="axis" x="220" y="355">准备时间（年）</text>
  <line x1="220" y1="405" x2="940" y2="405" stroke="#6A6963" stroke-width="3"/>
  <g class="axis" text-anchor="middle">
    <line x1="220" y1="394" x2="220" y2="990" stroke="#DEDDD6" stroke-width="2"/><text x="220" y="383">0</text>
    <line x1="400" y1="394" x2="400" y2="990" stroke="#DEDDD6" stroke-width="2"/><text x="400" y="383">1</text>
    <line x1="580" y1="394" x2="580" y2="990" stroke="#DEDDD6" stroke-width="2"/><text x="580" y="383">2</text>
    <line x1="760" y1="394" x2="760" y2="990" stroke="#DEDDD6" stroke-width="2"/><text x="760" y="383">3</text>
    <line x1="940" y1="394" x2="940" y2="990" stroke="#DEDDD6" stroke-width="2"/><text x="940" y="383">4</text>
  </g>

  <text class="label" x="108" y="540">本科</text>
  <rect x="220" y="460" width="720" height="100" rx="8" fill="#E7EAF2" stroke="#DEDDD6" stroke-width="2"/>
  <rect x="220" y="460" width="720" height="100" rx="8" fill="#134FFF"/>
  <text x="254" y="522" fill="#FFFFFF" font-size="30" font-weight="700" font-family="MiSans VF, PingFang SC, sans-serif">大学第一天开始，准备四年</text>

  <text class="label" x="108" y="712">研究生</text>
  <text class="axis" x="108" y="785">两年项目</text>
  <rect x="220" y="650" width="180" height="92" rx="8" fill="#FFFFFF" stroke="#6A6963" stroke-width="2"/>
  <text class="body" x="310" y="707" text-anchor="middle">研前一年</text>
  <rect x="400" y="650" width="360" height="92" rx="8" fill="#FFFFFF" stroke="#6A6963" stroke-width="2"/>
  <text class="body" x="580" y="707" text-anchor="middle">项目两年</text>

  <text class="axis" x="108" y="915">一年项目</text>
  <rect x="220" y="835" width="180" height="92" rx="8" fill="#FFFFFF" stroke="#6A6963" stroke-width="2"/>
  <text class="body" x="310" y="892" text-anchor="middle">研前一年</text>
  <rect x="400" y="835" width="180" height="92" rx="8" fill="#FFFFFF" stroke="#6A6963" stroke-width="2"/>
  <text class="body" x="490" y="892" text-anchor="middle">项目一年</text>

  <rect x="220" y="980" width="720" height="78" rx="6" fill="#FFFFFF" stroke="#DEDDD6" stroke-width="2"/>
  <text class="body" x="254" y="1030">暑期实习：有的项目只有一次机会，或没有暑假</text>
</svg>
